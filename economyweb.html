<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light">
<title>AZQ 経済ターミナル</title>
<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#f1f4f9;--line:#e4e8f0;--line2:#cfd6e4;--text:#1a2030;--mute:#5b6478;--dim:#8a93a6;
--up:#0e9f6e;--down:#e0353f;--gold:#b8860b;--accent:#2563eb;--soft:rgba(37,99,235,.1);--r:10px;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;--font:"Inter","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:24px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(20,30,60,.05)}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{font-size:16px;letter-spacing:.04em;color:#14203a}.logo b i{color:var(--gold);font-style:normal}
.logo small{color:var(--mute);font-size:12px}
.me{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip b{font-family:var(--mono)}
.chip.debt{border-color:var(--down);color:var(--down)}
.chip svg{flex:none}
.who{color:var(--mute);font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.tabs{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--mute);font:600 14px var(--font);padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
h2{font-size:12px;margin:0 0 10px;color:var(--mute);font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.banner{border:1px solid var(--gold);color:var(--gold);border-radius:var(--r);padding:10px 14px;margin:0 0 12px;font-size:13.5px;background:rgba(184,134,11,.06)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11.5px;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--panel2)}
.sym{font-weight:700}.nm{color:var(--mute);font-size:12px}
.px{font-family:var(--mono);font-weight:700;text-align:right;font-size:14px}
.chg{font-family:var(--mono);text-align:right;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.spark{width:110px;height:30px}
.symbtn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:5px 12px;font:600 12.5px var(--font);cursor:pointer}
.symbtn:hover{border-color:var(--gold);color:var(--gold)}
.order{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.order{grid-template-columns:1fr}}
.l{display:block;font-size:12px;color:var(--mute);font-weight:600;margin:0 0 5px}
input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;font:600 14px var(--mono);transition:border-color .15s}
select{width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.big{font-family:var(--mono);font-size:22px;font-weight:800;padding:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 18px;font:700 14px var(--font);cursor:pointer;color:#fff}
.btn.buy{background:var(--up);color:#fff;width:100%}
.btn.sell{background:var(--down);width:100%}
.btn.gold{background:var(--gold);color:#fff}
.btn.sub{background:var(--panel2);border:1px solid var(--line2);color:var(--text);font-size:13px;padding:8px 14px}
.btn.sub:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hold{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hold:last-child{border-bottom:0}
.hold span{min-width:0;overflow-wrap:anywhere;font-size:13.5px}
.msg{font-size:13.5px;margin:8px 0 0}
.msg.ok{color:var(--up)}.msg.ng{color:var(--down)}
.res{margin-top:10px;font-family:var(--mono);font-weight:800;font-size:22px;display:flex;align-items:center;gap:14px;justify-content:center;border-radius:8px;padding:12px;background:var(--panel2);border:1px solid var(--line2)}
.res.win{color:var(--up);border-color:var(--up);background:rgba(14,159,110,.07)}
.res.lose{color:var(--down);border-color:var(--down);background:rgba(224,53,63,.06)}
.res.flat{color:var(--mute)}
.res .amt{font-size:26px}
.res .sub2{font-size:12px;color:var(--mute);font-weight:600;font-family:var(--font)}
.res .dot{width:12px;height:12px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.res.pop{animation:pop .25s ease-out}
.rankme{font-size:13px;font-weight:700;margin:6px 0 0;color:var(--gold)}
.hint{color:var(--dim);font-size:12px;margin:8px 0 0;line-height:1.6}
.rank td:first-child{color:var(--dim);width:34px;font-family:var(--mono)}
footer{max-width:1080px;margin:18px auto 0;padding:0 16px;color:var(--dim);font-size:12px}
.auto{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;cursor:pointer}
.auto input{width:15px;height:15px;accent-color:var(--gold);padding:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.dot.u{background:var(--up)}.dot.d{background:var(--down)}
#load{color:var(--mute);text-align:center;padding:40px 0}
.hidden{display:none!important}
svg.ic{width:15px;height:15px;flex:none;vertical-align:-2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.5-4 5-5 8-5s6.5 1 8 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></symbol>
<symbol id="i-rf" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 22 20H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
<symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="5" width="10" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 6.5 19.5 7.5 16.8 19 13 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v6m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4.5 14a1.6 1.6 0 0 1 2.6-1.9L8 13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-hit" viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M17 8l4 2.5L18.5 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 8l9 5 9-5M12 13v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 16l4-5 3.5 3L17 6l3 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="currentColor"/></symbol>
</defs></svg>
<header>
  <div class="bar">
    <div class="logo"><b>AZQ <i>経済</i>ターミナル</b><small id="srvName"></small></div>
    <div class="me">
      <span class="who" id="who"></span>
      <span class="chip"><svg class="ic"><use href="#i-coin"/></svg>残高 <b id="meBal">—</b></span>
      <span class="chip debt hidden" id="meDebtWrap"><svg class="ic"><use href="#i-warn"/></svg>借金 <b id="meDebt">—</b></span>
      <span class="chip"><svg class="ic"><use href="#i-chart"/></svg>株評価 <b id="meTotal">—</b></span>
      <label class="auto"><input type="checkbox" id="autoRf" checked> 自動更新(60秒)</label>
      <button class="btn sub" id="rfBtn" type="button"><svg class="ic"><use href="#i-rf"/></svg>更新</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-t="market" aria-selected="true"><svg class="ic"><use href="#i-chart"/></svg>市場</button>
    <button role="tab" data-t="trade" aria-selected="false"><svg class="ic"><use href="#i-coin"/></svg>取引</button>
    <button role="tab" data-t="assets" aria-selected="false"><svg class="ic"><use href="#i-box"/></svg>資産</button>
    <button role="tab" data-t="games" aria-selected="false"><svg class="ic"><use href="#i-target"/></svg>ギャンブル</button>
    <button role="tab" data-t="shop" aria-selected="false"><svg class="ic"><use href="#i-box"/></svg>ショップ</button>
  </div>
</header>
<main>
  <div id="banner" class="banner hidden"></div>
  <div id="load">読み込み中…</div>
  <div id="tabsBody" class="hidden">
    <section id="t-market"></section>
    <section id="t-trade" class="hidden"></section>
    <section id="t-assets" class="hidden"></section>
    <section id="t-games" class="hidden"></section>
    <section id="t-shop" class="hidden"></section>
  </div>
</main>
<footer>AZQ BOT は非公式のBotであり、Discord Inc. とは関係ありません。株・ギャンブルは仮想通貨(コイン)によるサーバー内の遊びです。じゃんけん対戦(/rps)・マルチのブラックジャックはDiscordで。設定の変更は管理者用ダッシュボード(/economy config)から。</footer>
<script>
"use strict";
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const GID = Q.get("g") || "", TOKEN = Q.get("t") || "";
const S = {snap: null, me: null, bj: null, tab: "market", tradeSym: "", timer: null};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{1F300}-\u{1F5FF}\u{1F600}-\u{1F64F}\u{FE0F}\u{200D}\u{2705}\u{26A0}\u{26AB}\u{2B00}-\u{2BFF}\u{2B50}]/gu;
const clean = s => String(s == null ? "" : s).replace(EMOJI_RE, "").replace(/\s{2,}/g, " ").trim();
const num = v => Number(v || 0).toLocaleString("ja-JP");
const px = (v, sym) => sym + " " + Number(v || 0).toLocaleString("ja-JP", {maximumFractionDigits: 2});
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const sign = v => (v > 0 ? "+" : "") + Number(v || 0).toLocaleString("ja-JP", {maximumFractionDigits: 2});
const icon = id => `<svg class="ic"><use href="#${id}"/></svg>`;
const api = (p, o = {}) => fetch(p, Object.assign({credentials: "omit", cache: "no-store"}, o));
const post = body => api(`/api/eco/${GID}?t=${encodeURIComponent(TOKEN)}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
function spark(hist) {
  const w = 110, h = 30, a = (hist || []).slice(-30).map(Number);
  if (a.length < 2) a.push(a[0] || 0, a[0] || 0);
  const mn = Math.min(...a), mx = Math.max(...a), rg = (mx - mn) || 1;
  const pts = a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(h - 3 - (v - mn) / rg * (h - 6)).toFixed(1)}`).join(" ");
  const up = a[a.length - 1] >= a[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up ? "#0e9f6e" : "#e0353f"}" stroke-width="1.6"/></svg>`;
}
function setMsg(id, text, ok) { const el = document.getElementById(id); if (!el) return alert(clean(text) || ""); el.textContent = clean(text) || ""; el.className = "msg " + (ok ? "ok" : "ng"); }
async function load(silent) {
  try {
    const res = await api(`/api/eco/${GID}?t=${encodeURIComponent(TOKEN)}`);
    if (res.status === 404) { $("#load").textContent = "サーバーが見つかりません。(BOTがそのサーバーに参加している必要があります)"; return; }
    if (!res.ok) { $("#load").textContent = "読み込めませんでした(" + res.status + ")"; return; }
    const d = await res.json();
    S.snap = d; S.me = d.me || null;
    if (d.me && d.me.bj) { if (!S.bj || S.bj.status !== "playing") S.bj = d.me.bj; }
    else if (!S.bj || S.bj.status !== "playing") S.bj = null;
    $("#load").classList.add("hidden"); $("#tabsBody").classList.remove("hidden");
    $("#srvName").textContent = "— " + d.name;
    $("#who").innerHTML = d.user ? icon("i-user") + ` ${esc(d.user)}` : icon("i-eye") + " 閲覧モード(/economyweb で自分用リンクを取得)";
    if (!d.user || !TOKEN) { $("#banner").classList.remove("hidden"); $("#banner").innerHTML = icon("i-eye") + " <b>閲覧モード</b>です。Discordで <code>/economyweb</code> を実行して自分専用のリンクを取得すると、株の売買・ギャンブル・借金の返済ができます。"; }
    else $("#banner").classList.add("hidden");
    drawHeader(); draw();
  } catch (e) { $("#load").textContent = "サーバーに接続できませんでした。"; }
}
function drawHeader() {
  const me = S.me;
  $("#meBal").textContent = me ? num(me.bal) : "—";
  $("#meDebtWrap").classList.toggle("hidden", !(me && me.debt > 0));
  $("#meDebt").textContent = me ? num(me.debt) : "—";
  $("#meTotal").textContent = me ? num(me.total) : "—";
}
function draw() { drawMarket(); drawTrade(); drawAssets(); drawGames(); drawShop(); }
/* ---- 市場 ---- */
function drawMarket() {
  const e = S.snap;
  const rows = (e.stocks || []).map(s =>
    `<tr><td><span class="sym">${esc(s.sym)}</span><div class="nm">${esc(s.name)}</div></td>` +
    `<td class="px">${num(s.price)}</td>` +
    `<td class="chg ${cls(s.chg)}">${sign(s.chg)}%</td>` +
    `<td>${spark(s.hist)}</td>` +
    `<td style="text-align:right"><button class="symbtn" data-sym="${esc(s.sym)}">取引</button></td></tr>`).join("");
  $("#t-market").innerHTML =
    `<div class="card"><h2>${icon("i-chart")}相場(価格は1分ごとに変動)</h2>` +
    `<table><tr><th>銘柄</th><th style="text-align:right">価格(${esc(e.cfg.symbol)})</th><th style="text-align:right">本日比</th><th>チャート</th><th></th></tr>${rows}</table>` +
    `<p class="hint"><span class="dot u"></span> 上がり / <span class="dot d"></span> 下がり。チャートは直近約30分の動き。右上の更新ボタンまたは自動更新で最新化します。</p></div>`;
  document.querySelectorAll("#t-market .symbtn").forEach(b => b.onclick = () => { S.tradeSym = b.dataset.sym; showTab("trade"); });
}
/* ---- 取引 ---- */
function drawTrade() {
  const e = S.snap, me = S.me, stocks = e.stocks || [];
  const opts = stocks.map(s => `<option value="${esc(s.sym)}"${s.sym === S.tradeSym ? " selected" : ""}>${esc(s.sym)} ${esc(s.name)}</option>`).join("");
  const holds = (me && me.holdings || []).map(h =>
    `<div class="hold"><span>${esc(h.sym)} ${esc(h.name)} — <b>${num(h.n)}</b>株(平均 ${num(h.cost)})<br>評価 <span class="${cls(h.value - h.cost * h.n)}">${num(h.value)}(${sign(h.value - h.cost * h.n)})</span></span>` +
    `<button class="btn sub" data-sell="${esc(h.sym)}">全売却</button></div>`).join("");
  $("#t-trade").innerHTML =
    `<div class="order"><div class="card"><h2>${icon("i-coin")}注文</h2>` +
    `<span class="l">銘柄</span><select id="oSym">${opts || "<option value=''>銘柄がありません</option>"}</select>` +
    `<p class="big" id="oPx">—</p>` +
    `<span class="l">数量(株)</span><input type="number" id="oQty" min="1" placeholder="1">` +
    `<p class="hint">総額: <span id="oSum">—</span> / 手持ち: ${me ? num(me.bal) : "—"}</p>` +
    `<div class="acts"><button class="btn buy" id="oBuy">買い(ロング)</button><button class="btn sell" id="oSell">売り(空欄で全株式)</button></div>` +
    `<p class="msg" id="oMsg"></p>` +
    `<p class="hint">売りは保有株を売ります。価格は押した瞬間の値で約定します。</p></div>` +
    `<div class="card"><h2>保有ポジション</h2>${holds || "<p class='hint'>保有株はありません。「市場」または左の注文から購入できます。</p>"}` +
    `<p class="hint">損益は 平均取得単価 と 現在価格 から計算します。</p></div></div>`;
  const sel = $("#oSym"), qty = $("#oQty");
  const cur = () => stocks.find(s => s.sym === sel.value);
  const upd = () => { const s = cur(); $("#oPx").textContent = s ? px(s.price, e.cfg.symbol) : "—"; const n = parseInt(qty.value, 10); $("#oSum").textContent = s && n > 0 ? px(s.price * n, e.cfg.symbol) : "—"; };
  sel.onchange = () => { S.tradeSym = sel.value; upd(); }; qty.oninput = upd; upd();
  $("#oBuy").onclick = () => { const n = parseInt(qty.value, 10); if (!sel.value) return setMsg("oMsg", "銘柄がありません。", false); if (!n || n < 1) return setMsg("oMsg", "数量を入力してください。", false); op({action: "eco_stock_buy", symbol: sel.value, shares: n}, "oMsg"); };
  $("#oSell").onclick = () => { if (!sel.value) return setMsg("oMsg", "銘柄がありません。", false); const n = parseInt(qty.value, 10); op({action: "eco_stock_sell", symbol: sel.value, shares: n > 0 ? n : "all"}, "oMsg"); };
  document.querySelectorAll("#t-trade [data-sell]").forEach(b => b.onclick = () => op({action: "eco_stock_sell", symbol: b.dataset.sell, shares: "all"}, "oMsg", `保有中の ${b.dataset.sell} をすべて売却します。よろしいですか?`));
}
/* ---- 資産 ---- */
function drawAssets() {
  const e = S.snap, me = S.me;
  const holds = (me && me.holdings || []).map(h =>
    `<tr><td>${esc(h.sym)}<div class="nm">${esc(h.name)}</div></td><td class="px">${num(h.n)}</td><td class="px">${num(h.cost)}</td>` +
    `<td class="px">${num(h.value)}</td><td class="chg ${cls(h.pnl)}">${sign(h.pnl)}</td>` +
    `<td style="text-align:right"><button class="symbtn" data-sell="${esc(h.sym)}">全売却</button></td></tr>`).join("");
  const ranks = (e.top || []).map((u, i) => `<tr class="rank"><td>${i + 1}</td><td>${esc(u.name)}</td><td class="px" style="text-align:right">${num(u.bal)}</td></tr>`).join("");
  $("#t-assets").innerHTML =
    `<div class="card"><h2>${icon("i-coin")}資産</h2>` +
    (me && me.rank ? `<p class="rankme">順位: ${num(me.rank)}位(総資産)</p>` : "") +
    `<div class="order"><div><span class="l">残高</span><p class="big ${me && me.debt > 0 ? "down" : "up"}">${me ? num(me.bal) : "—"}</p></div>` +
    `<div><span class="l">株の評価合計</span><p class="big">${me ? num(me.total) : "—"}</p></div></div>` +
    (me && me.debt > 0 ? `<p class="msg ng">${icon("i-warn")} 借金 ${num(me.debt)}(上限 ${num(e.cfg.debt_max)}) — 収入(/daily・/work・コインドロップ)で自動返済されます。</p>
      <div class="acts"><input type="number" id="rpAmt" min="1" placeholder="返す金額" style="width:150px">
      <button class="btn sub" id="rpAll">全額返済</button><button class="btn sub" id="rpGo">返済</button></div>` : "") +
    `<p class="hint">借金があれば、入ってきたコインから自動で返済に回ります。</p></div>` +
    `<div class="card"><h2>保有株</h2><table><tr><th>銘柄</th><th style="text-align:right">数量</th><th style="text-align:right">平均取得</th><th style="text-align:right">評価</th><th style="text-align:right">損益</th><th></th></tr>${holds}</table>${!holds ? "<p class='hint'>保有株はありません。</p>" : ""}</div>` +
    `<div class="card"><h2>${e.cfg.rank_include_stocks !== false ? "総資産ランキング(上位10・株込み)" : "所持金ランキング(上位10)"}</h2><table><tr><th>#</th><th>メンバー</th><th style="text-align:right">${e.cfg.rank_include_stocks !== false ? "総資産" : "所持金"}</th></tr>${ranks}</table></div>`;
  if (me && me.debt > 0) {
    $("#rpAll").onclick = () => op({action: "eco_loan_repay", amount: "all"}, null, "借金を全額返済します。よろしいですか?");
    $("#rpGo").onclick = () => { const n = parseInt($("#rpAmt").value, 10); if (!n || n < 1) return alert("返す金額を入力してください。"); op({action: "eco_loan_repay", amount: n}, null); };
  }
  document.querySelectorAll("#t-assets [data-sell]").forEach(b => b.onclick = () => op({action: "eco_stock_sell", symbol: b.dataset.sell, shares: "all"}, null, `保有中の ${b.dataset.sell} をすべて売却します。よろしいですか?`));
}
/* ---- ギャンブル ---- */
function drawGames() {
  const e = S.snap, bj = S.bj;
  const playing = bj && bj.status === "playing";
  $("#t-games").innerHTML =
    `<div class="card"><h2>${icon("i-coin")}コインフリップ(当たると2倍)</h2>` +
    `<div class="acts"><input type="number" id="cfAmt" min="1" placeholder="賭け金" style="width:140px">` +
    `<button class="btn sub" id="cfH">表</button><button class="btn sub" id="cfT">裏</button></div><div class="res hidden" id="cfRes"></div><p class="msg" id="cfMsg"></p></div>` +
    `<div class="card"><h2>${icon("i-target")}ルーレット(0〜36)</h2>` +
    `<div class="acts"><input type="number" id="rtAmt" min="1" placeholder="賭け金" style="width:140px">` +
    `<select id="rtSel" style="width:auto"><option value="red">赤 (2倍)</option><option value="black">黒 (2倍)</option><option value="number">数字ぴったり (36倍)</option></select>` +
    `<input type="number" id="rtNum" min="0" max="36" placeholder="0-36" style="width:90px;display:none">` +
    `<button class="btn sub" id="rtGo">回す</button></div><div class="res hidden" id="rtRes"></div><p class="msg" id="rtMsg"></p></div>` +
    `<div class="card"><h2>${icon("i-cards")}ブラックジャック(1人用)</h2>` +
    `<div class="acts"><input type="number" id="bjAmt" min="1" placeholder="賭け金" style="width:140px" value="${bj ? bj.bet : ""}">` +
    (playing ? `<button class="btn sub" id="bjHit">${icon("i-hit")}hit(引く)</button><button class="btn sub" id="bjStand">${icon("i-hand")}stand(勝負)</button>`
             : `<button class="btn gold" id="bjGo">開始</button>`) + `</div>` +
    `<div id="bjArea" class="hint" style="font-family:var(--mono);font-size:13.5px;margin-top:8px"></div><div class="res hidden" id="bjRes"></div><p class="msg" id="bjMsg"></p>` +
    `<p class="hint">21に近づけるゲーム。ディーラーは17以上で止まります。21ちょうど(ブラックジャック)は1.5倍払い。21を超えると負け。</p></div>`;
  const bet = (input, fn, msgId) => {
    if (!S.me) return setMsg(msgId, "閲覧モードです。Discordで /economyweb を実行して自分用リンクを取得してください。", false);
    const n = parseInt(input.value, 10);
    if (!n || n < 1) return setMsg(msgId, "賭け金を入力してください。", false);
    fn(n);
  };
  $("#cfH").onclick = () => bet($("#cfAmt"), n => op({action: "eco_coinflip", amount: n, side: "heads"}, "cfMsg"), "cfMsg");
  $("#cfT").onclick = () => bet($("#cfAmt"), n => op({action: "eco_coinflip", amount: n, side: "tails"}, "cfMsg"), "cfMsg");
  $("#rtSel").onchange = () => $("#rtNum").style.display = $("#rtSel").value === "number" ? "" : "none";
  $("#rtGo").onclick = () => { const b = {action: "eco_roulette", choice: $("#rtSel").value}; if ($("#rtSel").value === "number") { const k = parseInt($("#rtNum").value, 10); if (isNaN(k) || k < 0 || k > 36) return setMsg("rtMsg", "0〜36の数字を入力してください。", false); b.number = k; } bet($("#rtAmt"), n => op(Object.assign(b, {amount: n}), "rtMsg"), "rtMsg"); };
  if (playing) { $("#bjHit").onclick = () => op({action: "eco_bj_hit"}, "bjMsg"); $("#bjStand").onclick = () => op({action: "eco_bj_stand"}, "bjMsg"); }
  else $("#bjGo").onclick = () => bet($("#bjAmt"), n => op({action: "eco_bj", bet: n}, "bjMsg"), "bjMsg");
  drawBjArea();
}
function drawBjArea() {
  const bj = S.bj, el = $("#bjArea");
  if (!el) return;
  if (!bj) { el.textContent = ""; return; }
  if (bj.status === "done") el.textContent = `あなた: ${bj.p.join(" ")} (${bj.pv}) / ディーラー: ${bj.dl.join(" ")} (${bj.dv})`;
  else el.textContent = `あなた: ${bj.p.join(" ")} (${bj.pv}) / ディーラー: ${bj.dl.join(" ")} [?]`;
}
/* ---- ショップ ---- */
function drawShop() {
  const e = S.snap;
  const rows = (e.items || []).map(it =>
    `<tr><td>${icon("i-box")} <b>${esc(it.name)}</b><div class="nm">${esc(it.desc || "")}</div></td>` +
    `<td class="px" style="text-align:right">${it.price > 0 ? num(it.price) : "—"}</td>` +
    `<td class="nm" style="text-align:right">${it.stock >= 0 ? `在庫 ${num(it.stock)}` : "無制限"}</td>` +
    `<td style="text-align:right">${it.price > 0 ? `<button class="symbtn" data-item="${esc(it.id)}">買う</button>` : ""}</td></tr>`).join("");
  $("#t-shop").innerHTML =
    `<div class="card"><h2>${icon("i-box")}ショップ</h2>` +
    `<table><tr><th>アイテム</th><th style="text-align:right">価格(${esc(e.cfg.symbol)})</th><th style="text-align:right">在庫</th><th></th></tr>${rows}</table>` +
    `<p class="hint">買うと持ち物に追加されます。使用(チェストを開ける・ブーストなど)はDiscordの <code>/item use</code> から。持ち物の確認は <code>/item inventory</code>。</p>` +
    `<p class="msg" id="shMsg"></p></div>`;
  document.querySelectorAll("#t-shop [data-item]").forEach(b => b.onclick = () => {
    const n = parseInt(prompt("買う個数を入力してください(1以上)") || "1", 10);
    if (!n || n < 1) return;
    op({action: "eco_item_buy", item: b.dataset.item, amount: n}, "shMsg");
  });
}
function showRes(id, res) {   // ギャンブルの結果を大きく表示(WIN/LOSE/引き分け)
  const el = document.getElementById(id);
  if (!el || !res) return;
  const draw = !!res.draw, win = !!res.win, net = res.net || 0;
  el.className = "res " + (draw ? "flat" : win ? "win" : "lose") + " pop";
  let sub = "";
  if (res.game === "coinflip") sub = `コイン: ${res.out}`;
  if (res.game === "roulette") sub = `出目: ${res.spin}(<span class="dot ${res.color === "green" ? "flat" : res.color === "red" ? "d" : ""}" style="background:${res.color === "green" ? "#3aa14a" : res.color === "red" ? "#e0353f" : "#20242c"}"></span>)`;
  if (res.game === "blackjack") sub = `あなた ${res.pv} / ディーラー ${res.dv}`;
  el.innerHTML = `<span>${draw ? "DRAW" : win ? "WIN" : "LOSE"}</span><span class="amt ${draw ? "" : win ? "up" : "down"}">${draw ? "±0" : (win ? "+" : "") + num(net)}</span><span class="sub2">${sub}</span>`;
  setTimeout(() => el.classList.remove("pop"), 350);
}
/* ---- 共通 ---- */
async function op(body, msgId, ask) {
  if (ask && !confirm(ask)) return;
  if (!S.me) { alert("閲覧モードです。Discordで /economyweb を実行して自分専用リンクを取得してください。"); return; }
  if (msgId) setMsg(msgId, "処理中…", true);
  try {
    const res = await post(body);
    if (res.status === 401) { $("#banner").classList.remove("hidden"); $("#banner").innerHTML = icon("i-warn") + " リンクの有効期限が切れました。Discordで <code>/economyweb</code> をもう一度実行してください。"; S.me = null; drawHeader(); return; }
    const txt = await res.text();
    let d = null; try { d = JSON.parse(txt); } catch (e) {}
    if (!res.ok) { if (msgId) setMsg(msgId, txt || `失敗しました(${res.status})`, false); return; }
    if (!d) { if (msgId) setMsg(msgId, "応答を解釈できませんでした。", false); return; }
    if (d.data) { if (d.data.me) S.me = d.data.me; if (d.data.eco) S.snap.eco = d.data.eco; S.bj = d.data.bj && d.data.bj.status !== "done" ? d.data.bj : null; }
    drawHeader(); draw();
    if (d.data && d.data.res) showRes({coinflip: "cfRes", roulette: "rtRes", blackjack: "bjRes"}[d.data.res.game], d.data.res);
    if (msgId) setMsg(msgId, d.msg, true);
  } catch (e) { if (msgId) setMsg(msgId, "通信に失敗しました。", false); }
}
function showTab(t) {
  S.tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.t === t)));
  ["market", "trade", "assets", "games", "shop"].forEach(k => $("#t-" + k).classList.toggle("hidden", k !== t));
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (b) showTab(b.dataset.t); });
$("#rfBtn").onclick = () => load(true);
$("#autoRf").onchange = () => { if (S.timer) { clearInterval(S.timer); S.timer = null; } if ($("#autoRf").checked) S.timer = setInterval(() => { if ($("#autoRf").checked) load(true); }, 60000); };
S.timer = setInterval(() => { if ($("#autoRf").checked) load(true); }, 60000);
if (!GID) { $("#load").textContent = "URLにサーバーIDがありません。Discordの /economyweb から開いてください。"; }
else load(false);
</script>
</body>
</html>
