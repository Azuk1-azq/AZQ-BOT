<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パッチノート一覧 - AZQBOT</title>
<meta name="description" content="AZQBOTのパッチノート(アップデート履歴)一覧">
<meta name="theme-color" content="#0d0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070910;--panel:rgba(22,24,38,.62);--panel2:rgba(32,35,54,.7);--line:rgba(120,130,190,.2);--line2:rgba(150,160,230,.38);--text:#eef0fa;--mute:#98a0bd;--violet:#7C5CFF;--cyan:#22D3EE;--blue:#5865F2;--blue2:#9aa4ff;--red:#ED4245;--green:#57F287;--yellow:#FEE75C;
--grad:linear-gradient(135deg,#7C5CFF,#22D3EE);--ease:cubic-bezier(.2,.8,.2,1);
--font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--disp:"Space Grotesk","Zen Kaku Gothic New",system-ui,sans-serif}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;font:400 16px/1.85 var(--font);background:var(--bg);color:var(--text);overflow-x:clip;position:relative}
a{color:var(--blue2)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:8px}
::selection{background:rgba(124,92,255,.5)}
/* ambient background */
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
background:radial-gradient(40% 36% at 22% 22%,rgba(124,92,255,.34),transparent 70%),radial-gradient(36% 32% at 80% 30%,rgba(34,211,238,.20),transparent 70%),radial-gradient(40% 36% at 55% 88%,rgba(124,92,255,.20),transparent 70%);
filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background-image:linear-gradient(rgba(150,160,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(150,160,230,.06) 1px,transparent 1px);background-size:56px 56px;
-webkit-mask-image:radial-gradient(70% 60% at 50% 0%,#000,transparent 80%);mask-image:radial-gradient(70% 60% at 50% 0%,#000,transparent 80%)}
@keyframes drift{0%{transform:translate3d(-3%,-2%,0) scale(1)}100%{transform:translate3d(4%,3%,0) scale(1.12) rotate(4deg)}}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;z-index:50;background:var(--grad);transform-origin:0 50%;transform:scaleX(var(--p,0));box-shadow:0 0 12px rgba(34,211,238,.7)}
.wrap{max-width:1040px;margin:auto;padding:0 24px;position:relative;z-index:1}
.wrap.narrow{max-width:820px}
/* nav */
.top{position:sticky;top:0;z-index:20;background:rgba(7,9,16,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{z-index:2}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0}
nav b{font-weight:900;font-size:18px;white-space:nowrap}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 21px/1 var(--disp);letter-spacing:-.02em}
.logo a{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.logo .azq-mark{width:34px;height:34px;flex:none;transition:transform .6s var(--ease),filter .4s;filter:drop-shadow(0 4px 10px rgba(124,92,255,.5));animation:pop .9s var(--ease) both}
.logo:hover .azq-mark{transform:rotate(-8deg) scale(1.12);filter:drop-shadow(0 6px 16px rgba(34,211,238,.7))}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:none}}
.logo-word{filter:drop-shadow(0 2px 6px rgba(34,211,238,.3))}
.logo-a,.logo-b{color:#fff;-webkit-background-clip:text;background-clip:text}
.logo-a{background-image:linear-gradient(180deg,#fff 20%,#a9b3cc 100%)}
.logo-b{font-weight:500;letter-spacing:.02em;color:#22d3ee;background-image:linear-gradient(180deg,#a5f0ff 10%,#22d3ee 100%)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.logo-a,.logo-b{color:transparent}}
nav div{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;justify-content:flex-end}
nav div a{color:var(--mute);text-decoration:none;font-size:14px;position:relative;padding:2px 0;transition:color .25s}
nav div a:not(.legal)::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
nav div a:hover{color:var(--text)}nav div a:not(.legal):hover::after{transform:scaleX(1)}
nav a.legal{color:var(--text);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;transition:border-color .25s,background .25s,box-shadow .25s}
nav a.legal:hover{border-color:var(--cyan);background:rgba(34,211,238,.08);box-shadow:0 0 18px rgba(34,211,238,.18)}
/* typography */
h1{font-size:clamp(34px,5.6vw,60px);line-height:1.2;margin:0 0 20px;font-weight:900;letter-spacing:-.01em}
.grad{background:linear-gradient(100deg,#a99bff,#22D3EE,#7C5CFF,#22D3EE);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-240% 0}}
.lead{color:var(--mute);font-size:17px;margin:0 0 32px;max-width:30em}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.4;margin:0 0 8px;font-weight:900}
h2::after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--grad);margin-top:10px}
.sec-lead{color:var(--mute);margin:0 0 28px}
section{padding:48px 0}
/* buttons */
.btn{position:relative;display:inline-block;overflow:hidden;background:var(--grad);color:#fff;padding:14px 30px;border-radius:14px;text-decoration:none;font-weight:700;box-shadow:0 8px 28px rgba(124,92,255,.38);transition:transform .3s var(--ease),box-shadow .3s}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .7s var(--ease)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(34,211,238,.4)}.btn:hover::after{left:130%}
.btn.alt{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:13px 26px;margin-left:10px;box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.alt:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(34,211,238,.2)}
.cta .btn.alt{margin-left:0;margin-top:10px}
.sub{display:block;margin-top:14px;color:var(--mute);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.badges span{background:rgba(87,242,135,.1);color:var(--green);border:1px solid rgba(87,242,135,.25);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:500}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:64px 0 72px}
.hero-vis{position:relative}
.orb{position:absolute;right:-18px;top:-62px;z-index:2;width:104px;height:104px;animation:float 5s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.65),rgba(34,211,238,.25) 55%,transparent 72%);filter:blur(10px);animation:pulse 3.4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(165,240,255,.4);animation:spin 18s linear infinite}
.orb .azq-mark{position:relative;z-index:1;width:100%;height:100%;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* chat */
.chat{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:20px;font-size:14px;line-height:1.6;box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02) inset}
.msg{display:flex;gap:12px;margin-bottom:16px}
.js .chat .msg{opacity:0;transform:translateY(14px);animation:msgIn .7s var(--ease) forwards}
.js .chat .msg:nth-child(1){animation-delay:.5s}.js .chat .msg:nth-child(2){animation-delay:1.7s}.js .chat .msg:nth-child(3){animation-delay:2.9s}
@keyframes msgIn{to{opacity:1;transform:none}}
.js .chat .msg:nth-child(1) .gone{animation:gone .6s 1.2s forwards}
@keyframes gone{to{opacity:.5}}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff}
.who{font-weight:700}.who small{color:var(--mute);font-weight:400;margin-left:6px}
.gone{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--red)}
.bot .av{background:#070910;box-shadow:inset 0 0 0 1px var(--line),0 0 16px rgba(124,92,255,.5)}
.av .azq-mark{width:28px;height:28px}
.tag{background:var(--blue);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.note{border-left:4px solid var(--red);background:var(--panel2);border-radius:6px;padding:10px 14px;margin-top:6px}
.note em{font-style:normal;color:var(--yellow)}
.cmd{background:var(--panel2);border-radius:8px;padding:8px 12px;color:var(--mute);margin-top:4px}
.cmd b{color:var(--cyan)}
/* tiles */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.tile{position:relative;overflow:hidden;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:24px;transition:transform .45s var(--ease),border-color .3s,box-shadow .45s}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(124,92,255,.22),rgba(34,211,238,.08) 45%,transparent 70%)}
.tile:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -16px rgba(124,92,255,.45)}
.tile:hover::after{opacity:1}
.tile h3{margin:0 0 6px;font-size:18px}
.tile p{margin:0;color:var(--mute);font-size:15px}
.t-a{grid-column:span 4;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(28,32,64,.6))}
.t-b{grid-column:span 2}
.t-c,.t-d,.t-e{grid-column:span 2}
.t-g{grid-column:span 3}
.t-f{grid-column:span 6;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;justify-content:space-between}
.t-f div{max-width:34em}
code{background:rgba(124,92,255,.16);color:#d5ccff;padding:2px 8px;border-radius:6px;font-size:.9em;border:1px solid rgba(124,92,255,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--text);transition:transform .25s var(--ease),border-color .25s,background .25s}
.chips span:hover{transform:translateY(-2px);border-color:var(--cyan);background:rgba(34,211,238,.1)}
.chips.sm{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .tile h3{display:flex;align-items:center;gap:10px}
.two .tile h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
.steps .tile{counter-increment:s;padding-top:56px}
.steps .tile::before{content:counter(s);position:absolute;top:18px;left:22px;width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 14px var(--disp);box-shadow:0 0 18px rgba(124,92,255,.6)}
.perm{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:14.5px}
.perm th,.perm td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.perm tr:last-child td{border-bottom:0}
.perm th{background:var(--panel2);font-weight:700}
.perm tr{transition:background .25s}.perm tr:not(:first-child):hover{background:rgba(124,92,255,.08)}
.perm td:first-child{white-space:nowrap;font-weight:700}
.scroll{overflow-x:auto;border-radius:18px}
.perm td:last-child{color:var(--mute)}
.ok{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ok ul{margin:8px 0 0;padding-left:1.2em;color:var(--mute);font-size:15px}
.ok li{margin:4px 0}
.ok h3{display:flex;align-items:center;gap:10px;margin:0}.ok h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.ok h3.n::before{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
details{background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 20px;transition:border-color .3s,box-shadow .3s}
details:hover{border-color:var(--line2)}
details[open]{border-color:rgba(124,92,255,.55);box-shadow:0 10px 30px -14px rgba(124,92,255,.5)}
summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--cyan);font-size:22px;line-height:1.4;transition:transform .4s var(--ease)}
details[open] summary::after{transform:rotate(135deg)}
details p{margin:0 0 16px;color:var(--mute);font-size:15px;animation:open .45s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}}
.cta{position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,rgba(124,92,255,.32),rgba(34,211,238,.14));border:1px solid var(--line2);border-radius:24px;padding:56px 24px;margin:24px 0}
.cta::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(124,92,255,.28),transparent 30%,rgba(34,211,238,.22),transparent 60%);animation:spin 16s linear infinite}
.cta>*{position:relative}.cta h2::after{margin-left:auto;margin-right:auto}
.cta h2{margin-bottom:20px}
footer{color:var(--mute);font-size:13px;padding:32px 0 56px;border-top:1px solid var(--line);margin-top:48px;position:relative;z-index:1}
footer a{color:var(--mute);transition:color .2s}footer a:hover{color:var(--text)}
/* patch note list */
.ph{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:56px 0 8px}
.ph h1{margin:0 0 8px}
.ph .orb{position:relative;right:auto;top:auto;flex:none;width:96px;height:96px;margin-right:14px}
.list{display:grid;gap:14px;margin:24px 0 48px;padding:0;list-style:none;position:relative}
.item{position:relative;overflow:hidden;display:block;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:22px 64px 22px 24px;color:var(--text);text-decoration:none;transition:transform .45s var(--ease),border-color .3s,box-shadow .45s}
.item::after{content:"→";position:absolute;right:26px;top:50%;transform:translateY(-50%);font:700 22px var(--disp);color:var(--cyan);transition:transform .4s var(--ease),right .4s var(--ease)}
.item:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 18px 40px -16px rgba(124,92,255,.5)}
.item:hover::after{right:20px}
.item::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(124,92,255,.22),transparent 70%)}
.item:hover::before{opacity:1}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:4px}
.ver{background:var(--grad);color:#fff;font:700 13px var(--disp);border-radius:999px;padding:1px 12px}
.new{background:rgba(87,242,135,.1);color:var(--green);border:1px solid rgba(87,242,135,.25);font-size:12px;font-weight:700;border-radius:999px;padding:0 10px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px rgba(87,242,135,.45)}}
.item h2{margin:0;font-size:19px;line-height:1.5}.item h2::after{display:none}
.item p{margin:4px 0 0;color:var(--mute);font-size:15px}
.item:hover h2{color:#fff}
/* reveal */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease) var(--d,0s),transform .8s var(--ease) var(--d,0s),border-color .3s,box-shadow .45s}
.js .rv.in{opacity:1;transform:none}
.js .rv.in.tile:hover,.js .rv.in.item:hover{transform:translateY(-4px)}
@media(max-width:820px){
.hero{grid-template-columns:1fr;gap:36px;padding-top:40px}
.orb{right:22px;top:-54px;width:84px;height:84px}
.t-a,.t-b,.t-c,.t-d,.t-e,.t-f,.t-g{grid-column:span 6}
.two,.ok,.steps{grid-template-columns:1fr}
nav div{gap:4px 14px}
.logo{font-size:19px;gap:8px}.logo .azq-mark{width:30px;height:30px}
.ph .orb{width:72px;height:72px}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important}
.js .rv,.js .chat .msg{opacity:1!important;transform:none!important}
}
</style><script>document.documentElement.classList.add('js')</script></head>
