<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZQ BOT ダッシュボード</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--sub:#667085;--line:#e4e7ec;--pri:#5865f2}
@media(prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--sub:#9aa3b2;--line:#2c313c}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}main{max-width:760px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px}label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
select,input[type=text],input[type=number],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:84px;resize:vertical}.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row input{width:auto}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:9px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:none;color:var(--sub);border:1px solid var(--line)}.hint{color:var(--sub);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}.center{text-align:center;padding:60px 0}
</style>
</head>
<body>
<header><h1>🛡️ AZQ BOT ダッシュボード</h1><span id="who" class="hint"></span><a id="out" class="btn ghost" href="#" hidden>ログアウト</a></header>
<main id="app"><div class="center hint">読み込み中...</div></main>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const app = $("#app");
const el = (t, p = {}, ...kids) => { const e = Object.assign(document.createElement(t), p); kids.flat().forEach(k => e.append(k)); return e; };
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); };
let API = "";  // 通常は空のままでOK(/web のリンクが接続先を自動で渡します)。独自ドメインのAPIを使う場合のみ書き換える
{ const q = new URLSearchParams(location.hash.slice(1)), a = q.get("api"), t = q.get("token");
  if (t) { sessionStorage.setItem("azq_token", t); if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(a || "")) sessionStorage.setItem("azq_api", a); history.replaceState(null, "", location.pathname); } }
API = sessionStorage.getItem("azq_api") || API;
const tok = () => sessionStorage.getItem("azq_token");
const api = async (url, opt = {}) => { opt.headers = Object.assign({}, opt.headers, tok() ? { Authorization: "Bearer " + tok() } : {}); const r = await fetch(API + url, opt); if (!r.ok) throw new Error((await r.text()) || r.status); return r.json(); };

// ---- 設定ゼロモード: /web のコードを貼り付けて編集し、「適用コード」をDiscordに貼り付ける(サーバーへの接続は不要)
const b64u = { enc: (u) => { let s = ""; u.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
  dec: (s) => Uint8Array.from(atob(s.trim().replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)) };
const pipe = async (u, st) => new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(st)).arrayBuffer());
const decode = async (s) => JSON.parse(new TextDecoder().decode(await pipe(b64u.dec(s), new DecompressionStream("deflate"))));
const encode = async (o) => b64u.enc(await pipe(new TextEncoder().encode(JSON.stringify(o)), new CompressionStream("deflate")));
function codeMode() {
  const ta = el("textarea", { placeholder: "/web で表示された読み込みコードを貼り付け" });
  const file = el("input", { type: "file", accept: ".txt", onchange: async () => { ta.value = await file.files[0].text(); } });
  const go = el("button", { textContent: "読み込む", onclick: async () => {
    try { const d = await decode(ta.value); render(d, async (b) => showCode(await encode({ v: 1, gid: d.gid, cfg: b })), "適用コードを作る"); }
    catch (e) { toast("⚠️ コードを読み込めません"); } } });
  app.replaceChildren(el("div", { className: "card" }, el("h2", { textContent: "設定を読み込む" }), el("p", { className: "hint", textContent: "Discordで /web を実行し、表示された読み込みコード(またはファイル)を入れてください。" }), ta, el("p", {}, file), go), el("div", { id: "form" }));
}
function showCode(code) {
  const box = $("#result") || app.appendChild(el("div", { id: "result", className: "card" }));
  box.replaceChildren(el("h2", { textContent: "適用コード" }), el("textarea", { readOnly: true, value: code }),
    el("button", { textContent: "コピー", onclick: () => navigator.clipboard.writeText(code).then(() => toast("コピーしました")) }),
    el("p", { className: "hint", textContent: "Discordの /web の「適用コードを貼り付ける」を押して貼り付けると、設定が反映されます。" }));
  box.scrollIntoView({ behavior: "smooth" });
}

async function init() {
  let me = null; try { me = await api("/api/me"); } catch (e) {}
  if (!me) return codeMode();
  if (!me.user && sessionStorage.getItem("azq_api")) { sessionStorage.removeItem("azq_token"); sessionStorage.removeItem("azq_api"); codeMode(); toast("ログインの有効期限が切れました。Discordで /web をもう一度実行してください"); return; }
  if (!me.user) { app.replaceChildren(el("div", { className: "center" }, el("p", { textContent: "Discordでログインして、サーバーの設定を変更します。" }), el("a", { className: "btn", href: API + "/login", textContent: "Discordでログイン" }))); return; }
  $("#who").textContent = me.user.name; $("#out").hidden = false;
  $("#out").onclick = async (e) => { e.preventDefault(); await api("/api/logout", { method: "POST" }).catch(() => {}); sessionStorage.removeItem("azq_token"); location.reload(); };
  if (!me.guilds.length) { app.replaceChildren(el("div", { className: "center hint", textContent: "管理者権限があり、BOTが導入されているサーバーがありません。" })); return; }
  const sel = el("select", { onchange: () => load(sel.value) }, me.guilds.map(g => el("option", { value: g.id, textContent: g.name })));
  app.replaceChildren(el("div", { className: "card" }, el("label", { textContent: "サーバーを選択", style: "margin-top:0" }), sel), el("div", { id: "form" }));
  load(me.guilds[0].id);
}

function chanSelect(chs, val) { return el("select", {}, el("option", { value: "", textContent: "(なし)" }), chs.map(c => el("option", { value: c.id, textContent: "#" + c.name, selected: String(val) === c.id }))); }
function check(label, on) { const i = el("input", { type: "checkbox", checked: !!on }); return [el("label", { className: "row", style: "color:var(--text);font-size:15px;margin:8px 0" }, i, label), i]; }

async function load(gid) {
  render(await api("/api/guild/" + gid), (b) => api("/api/guild/" + gid, { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "azq-dashboard" }, body: JSON.stringify(b) }).then(() => toast("✅ 保存しました")), "保存する");
}
function render(d, send, label) {
  const c = d.cfg;
  const log = chanSelect(d.channels, c.log_channel), wch = chanSelect(d.channels, c.welcome_channel), kch = chanSelect(d.channels, c.kaso_channel);
  const wmsg = el("textarea", { value: c.welcome_message }), role = el("select", {}, el("option", { value: "", textContent: "(なし)" }), d.roles.map(r => el("option", { value: r.id, textContent: r.name, selected: String(c.autorole) === r.id })));
  const ng = el("textarea", { value: c.ng_words.join("\n"), placeholder: "1行に1つ" }), th = el("input", { type: "number", min: 1, value: c.kaso_threshold });
  const [amL, am] = check("荒らし対策を有効にする", c.automod_enabled), [biL, bi] = check("招待リンクをブロックする", c.block_invites);
  const [kL, k] = check("過疎アラートを有効にする", c.kaso_enabled), [mL, m] = check("このサーバーで名言画像(/meigen)を使えるようにする", c.meigen_enabled);
  const L = (t, n) => [el("label", { textContent: t }), n];
  const save = el("button", { textContent: label, onclick: async () => {
    try { await send({ log_channel: log.value, welcome_channel: wch.value, welcome_message: wmsg.value, autorole: role.value, automod_enabled: am.checked, block_invites: bi.checked,
        ng_words: ng.value.split("\n").map(s => s.trim()).filter(Boolean), kaso_enabled: k.checked, kaso_channel: kch.value, kaso_threshold: +th.value, meigen_enabled: m.checked }); }
    catch (e) { toast("⚠️ " + e.message); }
  } });
  $("#form").replaceChildren(
    el("div", { className: "card" }, el("h2", { textContent: "基本設定" }), L("ログチャンネル", log), L("ウェルカムメッセージを送るチャンネル", wch), L("ウェルカムメッセージ({user} {server} {count} が使えます)", wmsg), L("自動ロール(参加時に付与)", role)),
    el("div", { className: "card" }, el("h2", { textContent: "荒らし対策" }), amL, biL, L("NGワード", ng)),
    el("div", { className: "card" }, el("h2", { textContent: "過疎アラート" }), kL, L("通知するチャンネル", kch), L("しきい値(24時間のメッセージ数がこれ未満で通知)", th)),
    el("div", { className: "card" }, el("h2", { textContent: "名言画像" }), mL),
    save, el("p", { className: "hint", textContent: "認証・チケット・ロールパネルの設定は、今のところスラッシュコマンド(/verify /ticketconfig /rolepanel)から行います。" }));
}
init().catch(e => { app.replaceChildren(el("div", { className: "center hint", textContent: "エラー: " + e.message })); });
</script>
</body>
</html>
