<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>認証</title><style>
:root {
  --bg: #edf0ec;
  --text: #14201c;
  --accent: #0a6a58;
  --line: color-mix(in srgb, var(--text) 22%, var(--bg));
  --panel: color-mix(in srgb, var(--text) 5%, var(--bg));
  --mute: color-mix(in srgb, var(--text) 74%, var(--bg));
}
* { box-sizing: border-box; }
body {
  display: grid;
  place-items: center;
  min-height: 100%;
  margin: 0;
  padding: 16px;
  font: 14px/1.6 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
  color: var(--text);
  background: var(--bg);
}
.card {
  width: 100%;
  max-width: 480px;
  padding: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
}
h1 { margin: 0 0 16px; font-size: 20px; font-weight: 700; }
p { margin: 0 0 16px; }
a { text-decoration: underline; color: var(--accent); }
code {
  padding: 0 8px;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.sub { font-size: 12px; color: var(--mute); }
.err {
  padding: 8px 16px;
  font-weight: 700;
  border: 1px solid var(--text);
  border-radius: 4px;
}
.g-recaptcha { min-height: 78px; margin: 16px 0 8px; }
button {
  height: 40px;
  padding: 0 24px;
  font: inherit;
  font-weight: 700;
  color: var(--bg);
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 4px;
  transition: background-color 150ms ease-out, opacity 150ms ease-out;
  cursor: pointer;
}
button:hover { background: var(--text); border-color: var(--text); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:disabled:hover { background: var(--accent); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style></head><body><div class="card"><h1>サンプルサーバー の認証</h1><p>チェックを入れて「認証する」を押してください。</p><form method="POST" action="/v"><input type="hidden" name="t" value="sample"><div class="g-recaptcha" style="display:flex;align-items:center;padding:0 16px;color:var(--mute);border:1px solid var(--line);border-radius:4px">私はロボットではありません(プレビュー用の枠)</div><button id="azqBtn" type="submit" disabled>認証する</button></form><p class="sub">IPアドレスは不正対策の確認だけに使い、そのままは保存しません。</p></div></body></html>
